<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0b09;
      --surface: #151310;
      --surface-2: #1a1814;
      --line: #2a2620;
      --text: #ece6da;
      --muted: #8a8275;
      --accent: #d18a1f;
      --accent-soft: rgba(209, 138, 31, 0.15);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-pill: 999px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
      padding: 56px 24px;
      min-height: 100vh;
    }

    header.top, main { max-width: 960px; margin: 0 auto; }

    .title-row {
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 16px; flex-wrap: wrap; padding-bottom: 32px;
    }

    .eyebrow {
      color: var(--accent); font-family: "IBM Plex Mono", monospace;
      font-size: 12px; letter-spacing: 0.25em; margin: 0 0 10px; text-transform: uppercase;
    }

    h1 {
      font-family: "Playfair Display", serif; font-weight: 400;
      font-size: 52px; margin: 0; line-height: 1.1;
    }

    button {
      font-family: "Inter", sans-serif; cursor: pointer;
      transition: transform 0.15s, background 0.2s, border-color 0.2s;
    }
    button:active { transform: scale(0.97); }

    .btn-primary, .btn-ghost {
      font-size: 14px; font-weight: 500; padding: 12px 22px;
      border-radius: var(--radius-pill); border: 1px solid var(--accent);
    }
    .btn-primary { background: var(--accent); color: #0c0b09; }
    .btn-primary:hover { background: #e0981f; }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--line); }
    .btn-ghost:hover { border-color: var(--muted); }

    .toolbar {
      display: flex; gap: 16px; align-items: center;
      margin-top: 8px; padding: 10px 18px;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius-pill);
    }
    .toolbar input {
      flex: 1; background: transparent; border: none; color: var(--text);
      font-size: 15px; outline: none; padding: 8px 0;
    }
    .toolbar select {
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--line); border-radius: var(--radius-pill);
      padding: 8px 14px; font-size: 13px; outline: none;
    }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 18px; margin-top: 32px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius-lg); padding: 22px;
      cursor: pointer; transition: border-color 0.2s, transform 0.2s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card h3 {
      font-family: "Playfair Display", serif; font-weight: 400;
      font-size: 24px; margin: 0 0 6px;
    }
    .card .universe {
      display: inline-block; font-family: "IBM Plex Mono", monospace;
      font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--accent); background: var(--accent-soft);
      padding: 4px 10px; border-radius: var(--radius-pill); margin: 0 0 14px;
    }
    .card p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0; }

    .empty {
      margin-top: 32px; border: 1px dashed var(--line);
      border-radius: var(--radius-lg); padding: 80px 20px;
      text-align: center; color: var(--muted);
      font-family: "IBM Plex Mono", monospace; font-size: 13px;
    }

    /* Pop-ups */
    .modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .modal[hidden] { display: none; }

    .modal-box {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius-lg); padding: 48px 52px;
      width: 100%; max-width: 760px; max-height: 90vh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }

    .modal-box h2 {
      font-family: "Playfair Display", serif; font-weight: 400;
      font-size: 44px; margin: 0; line-height: 1.1;
    }
    .subline {
      font-family: "Playfair Display", serif; font-style: italic;
      color: var(--muted); font-size: 16px; margin: -18px 0 0;
    }
    .tagline {
      font-family: "Playfair Display", serif; font-style: italic;
      font-size: 22px; line-height: 1.5; margin: 0;
      padding-bottom: 32px; border-bottom: 1px solid var(--line);
    }

    /* Detail pop-up */
    .stats {
      display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 28px 0; border-bottom: 1px solid var(--line);
    }
    .stat { padding: 0 20px; border-left: 1px solid var(--line); }
    .stat:first-child { padding-left: 0; border-left: none; }
    .stat-label {
      display: block; font-family: "IBM Plex Mono", monospace;
      font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 10px;
    }
    .stat-value { font-size: 15px; line-height: 1.5; }

    .sections {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 36px 48px;
    }
    .section-label {
      display: block; font-family: "IBM Plex Mono", monospace; font-size: 11px;
      letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent);
      margin-bottom: 12px;
    }
    .section-value {
      margin: 0; font-size: 14px; line-height: 1.7; color: var(--text);
      white-space: pre-line;
    }
    .section-value.empty-value { color: var(--muted); }

    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

    /* Add / edit form */
    #form-fields {
      display: grid; grid-template-columns: 1fr 1fr; gap: 28px 28px;
    }
    #form-fields label {
      display: flex; flex-direction: column; gap: 12px;
      font-family: "IBM Plex Mono", monospace; font-size: 11px;
      letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted);
    }
    #form-fields label.wide { grid-column: 1 / -1; }
    #form-fields input, #form-fields textarea {
      background: var(--surface-2); border: 1px solid var(--line);
      border-radius: var(--radius-md); color: var(--text);
      padding: 14px 16px; font-family: "Inter", sans-serif;
      font-size: 14px; letter-spacing: normal; text-transform: none;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    #form-fields input { min-height: 50px; }
    #form-fields textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
    #form-fields input:focus, #form-fields textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
    }

    @media (max-width: 720px) {
      h1 { font-size: 38px; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .modal-box { padding: 32px 24px; gap: 24px; }
      .modal-box h2 { font-size: 34px; }
      .stats { grid-template-columns: repeat(2, 1fr); row-gap: 20px; }
      .stat { padding: 0 0 0 0; border-left: none; }
      .sections, #form-fields { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="title-row">
      <div>
        <p class="eyebrow">THE COLLECTION</p>
        <h1>Character archive</h1>
      </div>
      <button id="open-add" class="btn-primary">+ Add character</button>
    </div>

    <div class="toolbar">
      <input id="search" type="text" placeholder="Search names, worlds, lore...">
      <select id="universe-filter">
        <option value="">All universes</option>
      </select>
    </div>
  </header>

  <main>
    <div id="list" class="grid"></div>
    <p id="empty" class="empty" hidden>No dossiers found in this corner of the archive.</p>
  </main>

  <!-- Detail pop-up -->
  <div id="detail-modal" class="modal" hidden>
    <div class="modal-box">
      <div>
        <p class="eyebrow" id="detail-universe"></p>
        <h2 id="detail-title"></h2>
      </div>
      <p id="detail-tagline" class="tagline"></p>
      <div id="detail-body"></div>
      <div class="modal-actions">
        <button id="delete-btn" class="btn-ghost">Delete</button>
        <button id="edit-btn" class="btn-ghost">Edit</button>
        <button id="close-detail" class="btn-primary">Close</button>
      </div>
    </div>
  </div>

  <!-- Add / edit pop-up -->
  <div id="form-modal" class="modal" hidden>
    <form id="add-form" class="modal-box">
      <div>
        <p class="eyebrow">ARCHIVE MANAGEMENT</p>
        <h2 id="form-title">New character</h2>
      </div>
      <p class="subline">Each entry enlargens the verses...</p>
      <div id="form-fields"></div>
      <div class="modal-actions">
        <button type="button" id="cancel" class="btn-ghost">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
