<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;500&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0b09;
      --surface: #151310;
      --line: #2a2620;
      --text: #ece6da;
      --muted: #8a8275;
      --accent: #d18a1f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
      padding: 48px 24px;
      min-height: 100vh;
    }
    header.top, main { max-width: 900px; margin: 0 auto; }
    .title-row {
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 16px; flex-wrap: wrap; padding-bottom: 32px;
    }
    .eyebrow {
      color: var(--accent); font-family: "IBM Plex Mono", monospace;
      font-size: 12px; letter-spacing: 0.25em; margin: 0 0 8px;
    }
    h1 { font-family: "Playfair Display", serif; font-weight: 400; font-size: 48px; margin: 0; }
    .btn-primary, .btn-ghost {
      font-family: "Inter", sans-serif; font-size: 14px; padding: 12px 18px;
      border-radius: 2px; cursor: pointer; border: 1px solid var(--accent);
    }
    .btn-primary { background: var(--accent); color: #0c0b09; font-weight: 500; }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--line); }
    .toolbar {
      display: flex; gap: 16px; align-items: center;
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      padding: 16px 0;
    }
    .toolbar input {
      flex: 1; background: transparent; border: none; color: var(--text);
      font-size: 15px; outline: none;
    }
    .toolbar select {
      background: var(--bg); color: var(--text); border: 1px solid var(--line);
      padding: 6px 8px; font-size: 13px;
    }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px; margin-top: 32px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--line); padding: 20px;
      cursor: pointer; transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--accent); }
    .card h3 { font-family: "Playfair Display", serif; font-weight: 400; font-size: 22px; margin: 0 0 4px; }
    .card .universe {
      font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.15em;
      color: var(--accent); text-transform: uppercase; margin: 0 0 12px;
    }
    .card p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0; }
    .empty {
      margin-top: 32px; border: 1px dashed var(--line); padding: 80px 20px;
      text-align: center; color: var(--muted);
      font-family: "IBM Plex Mono", monospace; font-size: 13px;
    }
    .modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal[hidden] { display: none; }
    .modal-box {
      background: var(--surface); border: 1px solid var(--line); padding: 28px;
      width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 16px;
    }
    .modal-box h2 { font-family: "Playfair Display", serif; font-weight: 400; margin: 0; }
    .modal-box label {
      display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted);
    }
    .modal-box input, .modal-box textarea {
      background: var(--bg); border: 1px solid var(--line); color: var(--text);
      padding: 10px; font-family: inherit; font-size: 14px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    #form-fields { display: flex; flex-direction: column; gap: 14px; }
    .detail-row { border-bottom: 1px solid var(--line); padding: 12px 0; }
    .detail-label {
      display: block; font-family: "IBM Plex Mono", monospace; font-size: 11px;
      letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
    }
    .detail-row p { margin: 0; font-size: 14px; line-height: 1.6; white-space: pre-line; }
    @media (max-width: 600px) { h1 { font-size: 36px; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="title-row">
      <div>
        <p class="eyebrow">THE COLLECTION</p>
        <h1>Character archive</h1>
      </div>
      <button id="open-add" class="btn-primary">+ Add character</button>
    </div>

    <div class="toolbar">
      <input id="search" type="text" placeholder="Search names, worlds, lore...">
      <select id="universe-filter">
        <option value="">All universes</option>
      </select>
    </div>
  </header>

  <main>
    <div id="list" class="grid"></div>
    <p id="empty" class="empty" hidden>No dossiers found in this corner of the archive.</p>
  </main>

  <!-- Detail pop-up -->
  <div id="detail-modal" class="modal" hidden>
    <div class="modal-box">
      <p class="eyebrow">DOSSIER</p>
      <h2 id="detail-title"></h2>
      <div id="detail-body"></div>
      <div class="modal-actions">
        <button id="delete-btn" class="btn-ghost">Delete</button>
        <button id="edit-btn" class="btn-ghost">Edit</button>
        <button id="close-detail" class="btn-primary">Close</button>
      </div>
    </div>
  </div>

  <!-- Add / edit pop-up -->
  <div id="form-modal" class="modal" hidden>
    <form id="add-form" class="modal-box">
      <p class="eyebrow">ARCHIVE MANAGEMENT</p>
      <h2 id="form-title">New dossier</h2>
      <div id="form-fields"></div>
      <div class="modal-actions">
        <button type="button" id="cancel" class="btn-ghost">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
